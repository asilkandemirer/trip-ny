<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NYC Trip</title>
<style>
:root{--bg:#f4f4f0;--card:#fff;--text:#111;--muted:#6f6e68;--line:#e2e0da}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit} .app{max-width:760px;margin:auto;padding:8px 8px 80px} .top{position:sticky;top:0;z-index:30;background:rgba(244,244,240,.96);backdrop-filter:blur(14px);padding:8px 0 10px}
.days{display:flex;gap:7px;overflow:auto;scrollbar-width:none} .days::-webkit-scrollbar{display:none} .daychip{border:1px solid #d8d6d0;background:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;white-space:nowrap} .daychip.active{background:#111;color:#fff;border-color:#111}
.summary{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:11px;color:#555;white-space:nowrap;overflow:auto}
.daytitle{font-size:20px;letter-spacing:-.03em;margin:18px 2px 10px}
.list{display:grid;gap:8px} .route-card{height:132px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:4px;display:grid;grid-template-columns:36% 1fr 18px;gap:9px;align-items:stretch;text-align:left;cursor:pointer;overflow:hidden}
.imagebox{position:relative;height:124px;border-radius:14px 0 0 14px;overflow:hidden;background:#ddd} .imagebox img{width:100%;height:100%;object-fit:cover;display:block}
.timechip{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.94);color:#111;border:1px solid rgba(0,0,0,.08);border-radius:11px;padding:7px 9px;font-size:11px;font-weight:950;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.copy{min-width:0;padding:10px 2px 8px 0;display:flex;flex-direction:column;overflow:hidden} .copy h3{font-size:16px;line-height:1.12;margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px} .copy p{font-size:11px;line-height:1.32;color:#555;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
.meta{margin-top:auto;display:flex;gap:5px;min-width:0;overflow:hidden} .meta span{font-size:9px;font-weight:850;background:#f1efe9;border-radius:999px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .chev{align-self:center;color:#aaa;font-size:20px}
.detail[hidden]{display:none!important} .detail{position:fixed;inset:0;z-index:100;background:#000;color:#fff} .hero{position:absolute;inset:0;overflow:hidden} .hero>img{width:100%;height:100%;object-fit:cover;display:block} .gradient{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18) 0%,rgba(0,0,0,.03) 40%,rgba(0,0,0,.74) 67%,rgba(0,0,0,.97) 100%)}
.story{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:62px;right:120px;display:flex;gap:4px} .seg{height:3px;flex:1;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden} .fill{height:100%;width:0;background:#fff} .seg.done .fill{width:100%} .seg.active .fill{animation:fill 5s linear forwards} @keyframes fill{to{width:100%}}
.tap{position:absolute;top:54px;bottom:45%;width:50%;border:0;background:transparent;z-index:4} .tap.left{left:0} .tap.right{right:0}
.topbar{position:absolute;z-index:8;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between} .tools{display:flex;gap:8px} .icon{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(15,15,15,.48);backdrop-filter:blur(12px);color:#fff;font-size:20px}
.detailcopy{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:16px 16px max(18px,env(safe-area-inset-bottom))} .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px} .chips span{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 8px;font-size:10px;font-weight:900}
.detailcopy h2{font-size:clamp(32px,9vw,46px);line-height:.96;letter-spacing:-.055em;margin:0 0 6px} .sub{font-size:13px;font-weight:800;color:#ddd;margin-bottom:9px} .desc{font-size:13.5px;line-height:1.48;color:#eee;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.live{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px} .field{display:flex;gap:7px;align-items:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px} .field span{font-size:9px;color:#aaa;text-transform:uppercase;font-weight:900} .field input,.field select{border:0;outline:0;background:transparent;color:#fff;font-size:12px;font-weight:900} .field option{color:#111}
.actions{display:grid;grid-template-columns:40px 1fr 1fr 40px;gap:8px;align-items:center} .nav{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:24px} .act{min-height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#fff;color:#111;font-size:11px;font-weight:950} .act.alt{background:rgba(255,255,255,.1);color:#fff} .route{display:block;text-align:center;margin-top:8px;color:#ddd;text-decoration:none;font-size:10px;font-weight:800}
.panel{position:absolute;z-index:20;top:max(64px,calc(env(safe-area-inset-top) + 56px));right:12px;width:min(88vw,370px);max-height:56%;background:rgba(18,18,18,.94);border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)} .panel[hidden]{display:none!important} .phead{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;border-bottom:1px solid rgba(255,255,255,.1)} .phead h3{margin:2px 0 0} .phead small{font-size:9px;color:#999;font-weight:900} .close{border:0;background:transparent;color:#fff;font-size:26px}
.notes{max-height:250px;overflow:auto;padding:10px;display:grid;gap:8px} .note{display:flex;gap:9px;align-items:center;background:#2a2a2a;border-radius:12px;padding:10px} .note.checked{opacity:.5} .note.checked .ntxt{text-decoration:line-through} .ncheck{width:22px;height:22px;border-radius:7px;border:1px solid #777;background:transparent;color:#111} .note.checked .ncheck{background:#fff} .ntxt{font-size:13px;flex:1} .ndel{border:0;background:#5b1e1a;color:#ffd8d4;border-radius:9px;padding:6px 8px;font-size:10px}
.nform{display:grid;grid-template-columns:1fr 40px;gap:7px;padding:10px;border-top:1px solid rgba(255,255,255,.1)} .nform input{min-width:0;border:0;border-radius:12px;padding:11px;font-size:16px} .nform button{border:0;border-radius:12px;background:#fff;font-size:18px;font-weight:900}
.mapwrap{height:240px;background:#ddd} .mapwrap iframe{width:100%;height:100%;border:0} .mapsum{padding:12px 14px;color:#ddd;font-size:12px;line-height:1.45}
@media(max-width:520px){.route-card{grid-template-columns:38% 1fr 16px} .detailcopy{padding-left:14px;padding-right:14px} .panel{left:12px;right:12px;width:auto}}

.icon svg,.nav svg,.chev svg{
  width:22px;height:22px;display:block;fill:none;stroke:currentColor;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
}
.icon,.nav{display:grid;place-items:center}
.chev svg{width:18px;height:18px;stroke-width:2.8}
.icon{background:rgba(10,10,10,.56);border:1.5px solid rgba(255,255,255,.28)}
.nav{border:1.5px solid rgba(255,255,255,.24)}
.mapwrap{position:relative}
.map-loading{
  position:absolute;inset:0;display:grid;place-items:center;
  background:#efeee9;color:#555;font-size:12px;font-weight:800;
}
.mapwrap.loaded .map-loading{display:none}
.map-fallback{
  display:block;margin:0 12px 12px;padding:10px 12px;border-radius:12px;
  background:#fff;color:#111;text-align:center;text-decoration:none;
  font-size:11px;font-weight:900;
}
</style></head>

let dayIndex=0,itemIndex=0,photoIndex=0,photoTimer=null;
const states=JSON.parse(localStorage.getItem('nyc.states')||'{}');
const notes=JSON.parse(localStorage.getItem('nyc.notes')||'{}');
const timing=JSON.parse(localStorage.getItem('nyc.timing')||'{}');
const $=id=>document.getElementById(id);
const els={days:$('days'),summary:$('summary'),daytitle:$('daytitle'),list:$('list'),detail:$('detail'),hero:$('heroImg'),story:$('story'),dmeta:$('dmeta'),dtitle:$('dtitle'),dsub:$('dsub'),ddesc:$('ddesc'),start:$('startInput'),dur:$('durInput'),route:$('routeLink'),notesPanel:$('notesPanel'),notesList:$('notesList'),noteInput:$('noteInput'),mapPanel:$('mapPanel'),mapFrame:$('mapFrame'),mapSummary:$('mapSummary'),mapWrap:$('mapWrap'),mapFallback:$('mapFallback')};
const key=(d=dayIndex,i=itemIndex)=>DAYS[d].id+'-'+i;
const item=()=>DAYS[dayIndex].items[itemIndex];
function parseTime(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m?Number(m[1])*60+Number(m[2]):null}
function fmt(m){m=(m+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function travelMin(t){let m=/(\d+)[–-](\d+)\s*dk/.exec(t||'');if(m)return Math.round((+m[1]+ +m[2])/2);m=/(\d+)\s*dk/.exec(t||'');if(m)return +m[1];return /metro|subway|treni/i.test(t||'')?25:12}
function ensureTiming(d,i){const k=key(d,i),it=DAYS[d].items[i];if(!timing[k])timing[k]={start:it.time,duration:it.duration,manual:false};return timing[k]}
function recalc(d){const arr=DAYS[d].items;for(let i=1;i<arr.length;i++){const prev=ensureTiming(d,i-1),cur=ensureTiming(d,i),it=arr[i];if(it.fixed&&!cur.manual)cur.start=it.time;else if(!cur.manual){const p=parseTime(prev.start);if(p!==null)cur.start=fmt(p+prev.duration+travelMin(it.travel))}}localStorage.setItem('nyc.timing',JSON.stringify(timing))}
DAYS.forEach((_,i)=>recalc(i));
function render(){const d=DAYS[dayIndex];els.days.innerHTML='';DAYS.forEach((x,i)=>{const b=document.createElement('button');b.className='daychip'+(i===dayIndex?' active':'');b.textContent=x.label;b.onclick=()=>{dayIndex=i;render()};els.days.appendChild(b)});els.summary.innerHTML='<b>Bugünün rotası:</b> '+d.route;els.daytitle.textContent=d.title;els.list.innerHTML='';d.items.forEach((it,i)=>{const t=ensureTiming(dayIndex,i),st=states[key(dayIndex,i)]||'';const b=document.createElement('button');b.className='route-card';b.type='button';b.dataset.index=i;b.innerHTML=`<div class="imagebox"><img src="${it.images[0]}" alt=""><span class="timechip">${t.start}</span></div><div class="copy"><h3>${it.title}</h3><p>${it.subtitle}</p><div class="meta"><span>◷ ${t.duration<60?t.duration+' dk':(t.duration/60)+' sa'}</span><span>${it.travel}</span></div></div><div class="chev">${st==='done'?'✓':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>'}</div>`;els.list.appendChild(b)})}
function openDetail(i){itemIndex=Number(i);photoIndex=0;els.detail.hidden=false;document.body.style.overflow='hidden';syncDetail()}
function closeDetail(){els.detail.hidden=true;els.notesPanel.hidden=true;els.mapPanel.hidden=true;document.body.style.overflow='';clearTimeout(photoTimer)}
function syncDetail(){const it=item(),t=ensureTiming(dayIndex,itemIndex),st=states[key()]||'';els.dtitle.textContent=it.title;els.dsub.textContent=it.subtitle;els.ddesc.textContent=it.desc;els.start.value=t.start;els.dur.value=String(t.duration);els.route.href=it.maps;els.dmeta.innerHTML=`<span>${it.tag}</span><span>${t.start}</span><span>${t.duration} dk</span><span>${it.travel}</span>`;$('doneBtn').textContent=st==='done'?'✓ Gidildi':'✓ Gidildi';renderStory();if(!els.notesPanel.hidden)renderNotes()}
function renderStory(){clearTimeout(photoTimer);const imgs=item().images||[];if(photoIndex>=imgs.length)photoIndex=0;els.hero.src=imgs[photoIndex];els.story.innerHTML='';imgs.forEach((_,i)=>{const s=document.createElement('div');s.className='seg '+(i<photoIndex?'done':i===photoIndex?'active':'');s.innerHTML='<div class="fill"></div>';els.story.appendChild(s)});if(photoIndex<imgs.length-1)photoTimer=setTimeout(()=>{photoIndex++;renderStory()},5000)}
function nextPhoto(){const imgs=item().images;if(photoIndex<imgs.length-1){photoIndex++;renderStory()}}
function prevPhoto(){if(photoIndex>0){photoIndex--;renderStory()}}
function nextStop(){if(itemIndex<DAYS[dayIndex].items.length-1)itemIndex++;else if(dayIndex<DAYS.length-1){dayIndex++;itemIndex=0;render()}photoIndex=0;syncDetail()}
function prevStop(){if(itemIndex>0)itemIndex--;else if(dayIndex>0){dayIndex--;itemIndex=DAYS[dayIndex].items.length-1;render()}photoIndex=0;syncDetail()}
function mark(v){const k=key();states[k]=states[k]===v?'':v;localStorage.setItem('nyc.states',JSON.stringify(states));render();syncDetail()}
function updateTiming(){const t=ensureTiming(dayIndex,itemIndex);t.start=els.start.value;t.duration=Number(els.dur.value);t.manual=true;recalc(dayIndex);localStorage.setItem('nyc.timing',JSON.stringify(timing));render();syncDetail()}
function noteArr(){const k=key();if(!Array.isArray(notes[k]))notes[k]=[];return notes[k]}
function saveNotes(){localStorage.setItem('nyc.notes',JSON.stringify(notes))}
function renderNotes(){els.notesList.innerHTML='';const a=noteArr();if(!a.length)els.notesList.innerHTML='<div style="color:#999;font-size:12px;padding:8px">Henüz not yok.</div>';a.forEach((n,i)=>{const r=document.createElement('div');r.className='note'+(n.checked?' checked':'');r.innerHTML=`<button class="ncheck" type="button">${n.checked?'✓':''}</button><div class="ntxt"></div><button class="ndel" type="button">Sil</button>`;r.querySelector('.ntxt').textContent=n.text;r.querySelector('.ncheck').onclick=()=>{n.checked=!n.checked;saveNotes();renderNotes()};r.querySelector('.ndel').onclick=()=>{a.splice(i,1);saveNotes();renderNotes()};els.notesList.appendChild(r)})}
function openMap(){
  els.notesPanel.hidden=true;
  els.mapPanel.hidden=!els.mapPanel.hidden;
  if(els.mapPanel.hidden)return;

  const it=item();
  const next=DAYS[dayIndex].items[itemIndex+1];
  const origin=encodeURIComponent(it.title+' New York');
  const destination=encodeURIComponent((next?next.title:it.title)+' New York');

  els.mapWrap.classList.remove('loaded');

  if(next){
    // Keyless Google Maps directions embed. More reliable than the previous place-only query.
    els.mapFrame.src='https://www.google.com/maps?output=embed&saddr='+origin+'&daddr='+destination;
    els.mapSummary.innerHTML=`<b>${it.title}</b> → <b>${next.title}</b><br>${next.travel}`;
    els.mapFallback.href='https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+destination;
  }else{
    els.mapFrame.src='https://www.google.com/maps?q='+origin+'&output=embed';
    els.mapSummary.textContent='Bu günün son durağı.';
    els.mapFallback.href=it.maps;
  }
}
els.list.addEventListener('click',e=>{const c=e.target.closest('.route-card');if(c)openDetail(c.dataset.index)});
$('backBtn').onclick=closeDetail;$('photoNext').onclick=nextPhoto;$('photoPrev').onclick=prevPhoto;$('nextBtn').onclick=nextStop;$('prevBtn').onclick=prevStop;$('doneBtn').onclick=()=>mark('done');$('skipBtn').onclick=()=>mark('skip');els.start.onchange=updateTiming;els.dur.onchange=updateTiming;
$('noteBtn').onclick=()=>{els.mapPanel.hidden=true;els.notesPanel.hidden=!els.notesPanel.hidden;if(!els.notesPanel.hidden)renderNotes()};$('noteClose').onclick=()=>els.notesPanel.hidden=true;$('mapBtn').onclick=openMap;$('mapClose').onclick=()=>els.mapPanel.hidden=true;els.mapFrame.addEventListener('load',()=>els.mapWrap.classList.add('loaded'));
$('noteForm').onsubmit=e=>{e.preventDefault();const v=els.noteInput.value.trim();if(!v)return;noteArr().push({text:v,checked:false});els.noteInput.value='';saveNotes();renderNotes()};
let sx=null,sy=null;els.detail.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select,a,.panel'))return;sx=e.clientX;sy=e.clientY});els.detail.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))dx<0?nextStop():prevStop();sx=sy=null});
render();
</script></body></html>
