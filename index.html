<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--text)}
.app{max-width:760px;margin:auto;padding:0 12px 90px}.topnav{position:sticky;top:0;z-index:40;background:rgba(246,246,242,.96);backdrop-filter:blur(14px);padding:12px 0 10px;border-bottom:1px solid rgba(0,0,0,.04)}
.days{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.daychip{border:1px solid #d7d4cd;background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.03)}.daychip.active{background:#171717;color:#fff;border-color:#171717}
.route-summary{margin:10px 0 4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:11px;line-height:1.45;color:#5e5d59;white-space:nowrap;overflow:auto}.route-summary b{color:#111}
.daytitle{font-size:21px;letter-spacing:-.03em;margin:20px 3px 10px}.list{display:grid;gap:10px}.route-card{display:grid;grid-template-columns:92px 1fr 26px;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.025)}.thumb{width:92px;height:104px;border-radius:14px;object-fit:cover;background:#ddd}.route-card h3{font-size:17px;line-height:1.15;margin:0 0 5px;letter-spacing:-.02em}.route-card p{font-size:12px;line-height:1.4;color:#555;margin:0 0 8px}.meta{display:flex;gap:5px;flex-wrap:wrap}.meta span{font-size:9px;font-weight:850;border-radius:999px;padding:5px 7px;background:#f0eee8;color:#555}.chev{font-size:22px;color:#aaa}.route-card.done{opacity:.58}.route-card.done .chev{color:var(--green)}.route-card.skipped{opacity:.48}
.detail{position:fixed;inset:0;background:#000;z-index:100;display:none}.detail.open{display:block}.detail-media{position:absolute;inset:0}.detail-media img{width:100%;height:100%;object-fit:cover}.detail-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,rgba(0,0,0,.05) 42%,rgba(0,0,0,.78) 64%,rgba(0,0,0,.96) 100%)}.detail-top{position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;z-index:3}.back,.floatbtn{border:0;background:rgba(18,18,18,.68);color:#fff;backdrop-filter:blur(12px);border-radius:999px;height:42px;min-width:42px;padding:0 14px;font-weight:900}.floatset{display:flex;gap:8px}.detail-content{position:absolute;left:0;right:0;bottom:0;padding:0 18px max(24px,env(safe-area-inset-bottom));color:#fff;z-index:2}.inverse{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.inverse span{font-size:10px;font-weight:900;padding:6px 9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}.detail h2{font-size:36px;line-height:.98;letter-spacing:-.05em;margin:0 0 8px}.detail .sub{font-size:13px;color:#ddd;font-weight:700;margin-bottom:12px}.detail .desc{font-size:14px;line-height:1.5;color:#eee;margin:0 0 16px;max-width:620px}.detail-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.dact{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:14px;padding:12px 8px;font-size:11px;font-weight:900;text-align:center;text-decoration:none}.dact.primary{background:#fff;color:#111}.dact.done{background:#eaf7ef;color:#1f7a47;border-color:#eaf7ef}.dact.skip{background:#3a1714;color:#ffd9d5;border-color:#5b2521}
.sheet{position:fixed;left:12px;right:12px;bottom:12px;z-index:130;background:#fff;border-radius:22px;padding:16px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.3)}.sheet.open{display:block}.sheet h3{margin:0 0 8px}.sheet textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:vertical}.sheetrow{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.sheet button{border:0;border-radius:11px;padding:10px 13px;font-weight:900}.mapmock{background:#f4f2ec;border-radius:16px;padding:14px}.routeviz{height:72px;position:relative;margin:8px 0}.routeviz:before{content:"";position:absolute;left:14px;right:14px;top:34px;height:3px;background:#111;border-radius:99px}.dot{position:absolute;top:27px;width:16px;height:16px;border-radius:50%;background:#111}.dot.a{left:8px}.dot.b{right:8px}.arrowline{position:absolute;right:50%;top:25px;font-size:24px}.mapcopy{font-size:12px;line-height:1.5;color:#555}.swipehint{text-align:center;color:#aaa;font-size:10px;margin-top:10px}
@media(max-width:520px){.route-card{grid-template-columns:78px 1fr 22px}.thumb{width:78px;height:96px}.detail h2{font-size:33px}.detail-actions{grid-template-columns:1fr 1fr}.dact.primary{grid-column:1/-1}}

.navactions{grid-template-columns:44px 1fr 1fr 44px;align-items:center}
.navcircle{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;font-size:25px;line-height:1;font-weight:600;backdrop-filter:blur(12px)}
.notes-panel{position:absolute;z-index:5;top:max(72px,calc(env(safe-area-inset-top) + 62px));right:12px;width:min(86vw,360px);max-height:48vh;display:none;flex-direction:column;background:rgba(15,15,15,.86);color:#fff;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);border-radius:20px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.38)}
.notes-panel.open{display:flex}
.notes-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.12)}
.notes-head h3{margin:2px 0 0;font-size:18px}.notes-kicker{font-size:9px;font-weight:900;letter-spacing:.08em;color:#bbb}.notes-close{border:0;background:transparent;color:#fff;font-size:26px;line-height:1}
.notes-list{overflow:auto;padding:10px 10px 4px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.note-row-wrap{position:relative;overflow:hidden;border-radius:14px}
.note-delete{position:absolute;right:0;top:0;bottom:0;width:72px;border:0;background:#c43f35;color:#fff;font-weight:900}
.note-row{position:relative;z-index:2;display:flex;align-items:center;gap:10px;background:#272727;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 12px;transition:transform .18s ease}
.note-row.reveal{transform:translateX(-72px)}
.note-check{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.5px solid #777;background:transparent;color:#fff;font-size:13px}

.note-help{font-size:9px;color:#aaa;padding:0 12px 11px}
@media(max-width:520px){.navactions{grid-template-columns:40px 1fr 1fr 40px}.navcircle{width:38px;height:38px}.notes-panel{width:calc(100vw - 24px);max-height:52vh}}


.storybar{position:absolute;top:max(10px,env(safe-area-inset-top));left:64px;right:120px;z-index:4;display:flex;gap:4px}.storyseg{height:3px;flex:1;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}.storyfill{height:100%;width:0;background:#fff}.storyseg.done .storyfill{width:100%}.storyseg.active .storyfill{animation:storyfill var(--storydur,5s) linear forwards}@keyframes storyfill{from{width:0}to{width:100%}}.storytap{position:absolute;top:0;bottom:42%;width:50%;z-index:2;border:0;background:transparent}.storytap.prev{left:0}.storytap.next{right:0}.time-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.time-edit{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:850}.time-edit input,.time-edit select{border:0;background:transparent;color:#fff;font:inherit;font-weight:900;outline:none}.time-edit input{width:76px}.time-edit select option{color:#111}.recalc{font-size:10px;color:#bbb;margin:-4px 0 10px}.livebadge{display:inline-flex;align-items:center;gap:5px}.livebadge:before{content:'';width:6px;height:6px;border-radius:50%;background:#67d88a}

/* v9.2 route list card refresh */
.app{padding-left:8px;padding-right:8px}
.list{gap:8px}
.route-card{
  position:relative;
  display:grid;
  grid-template-columns:42% 1fr 20px;
  gap:10px;
  align-items:stretch;
  min-height:124px;
  padding:5px;
  border-radius:18px;
  overflow:hidden;
}
.thumbwrap{
  position:relative;
  min-width:0;
  min-height:114px;
  border-radius:14px;
  overflow:hidden;
  background:#ddd;
}
.thumb{
  width:100%;
  height:100%;
  min-height:114px;
  border-radius:0;
  object-fit:cover;
  display:block;
}
.card-time{
  position:absolute;
  left:8px;
  top:8px;
  z-index:2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:42px;
  height:28px;
  padding:0 9px;
  border-radius:999px;
  background:rgba(15,15,15,.78);
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(10px);
  font-size:11px;
  font-weight:950;
  letter-spacing:.02em;
}
.route-copy{
  min-width:0;
  padding:7px 2px 7px 0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.route-card h3{
  font-size:17px;
  line-height:1.12;
  margin:0 0 5px;
}
.route-card p{
  font-size:11.5px;
  line-height:1.35;
  margin:0 0 9px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.meta{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  align-items:center;
}
.meta span{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:9px;
  font-weight:850;
  border-radius:999px;
  padding:5px 7px;
  background:#f1efe9;
  color:#555;
}
.meta .transport{
  background:#eceff4;
  color:#2d3440;
}
.meta .duration{
  background:#f5f1e7;
  color:#5f5033;
}
.chev{
  align-self:center;
  justify-self:center;
  padding-right:2px;
}
@media(max-width:520px){
  .route-card{grid-template-columns:44% 1fr 18px;min-height:118px;padding:4px;gap:8px}
  .thumbwrap,.thumb{min-height:110px}
  .route-card h3{font-size:16px}
  .route-card p{font-size:11px}
  .meta span{font-size:8.5px;padding:4px 6px}
  .card-time{left:7px;top:7px;height:26px;min-width:40px;font-size:10px}
}

}

.route-copy{

}

@media(max-width:520px){

    height:128px;
    min-height:128px;
    max-height:128px;
    grid-template-columns:36% 1fr 16px;
  }

  .card-time{left:8px;bottom:8px;height:30px;min-width:48px;font-size:11px;border-radius:11px}
}


.route-card{font:inherit;color:inherit;text-align:left;width:100%}
.route-card:focus-visible{outline:2px solid #111;outline-offset:2px}


/* v9.5 click + image radius fix */
.route-card{cursor:pointer;position:relative}
.thumbwrap{
  border-radius:16px 0 0 16px !important;
  overflow:hidden;
}
.thumb{
  border-radius:16px 0 0 16px !important;
}
.detail[hidden]{display:none !important}
.detail:not([hidden]){display:block !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important}

.panel-route-link{display:block;margin:0 12px 12px;padding:11px;border-radius:12px;background:#fff;color:#111;text-align:center;text-decoration:none;font-size:11px;font-weight:900}

<body>
<div class="app">
  <div class="topnav">
    <div class="days" id="days"></div>
    <div class="route-summary" id="summary"></div>
  </div>
  <h1 class="daytitle" id="daytitle"></h1>
  <div class="list" id="list"></div>
</div>


<div class="detail" id="detail" hidden>
  <div class="detail-visual">
    <img id="detailImg" alt="">
    <div class="detail-gradient"></div>

    <div class="storybar" id="storybar"></div>
    <button class="storytap storytap-left" type="button" aria-label="Önceki görsel"></button>
    <button class="storytap storytap-right" type="button" aria-label="Sonraki görsel"></button>

    <div class="detail-topbar">
      <button class="icon-btn glass" id="closeDetailBtn" type="button" aria-label="Detayı kapat">‹</button>
      <div class="detail-tools">
        <button class="icon-btn glass" id="noteToggle" type="button" aria-label="Notlar">✎</button>
        <button class="icon-btn glass" id="mapToggle" type="button" aria-label="Harita">⌖</button>
      </div>
    </div>

    <section class="detail-copy">
      <div class="detail-chips" id="detailMeta"></div>
      <h2 id="detailTitle"></h2>
      <div class="detail-subtitle" id="detailSub"></div>
      <p class="detail-desc" id="detailDesc"></p>

      <div class="live-plan">
        <label class="live-field">
          <span>Başlangıç</span>
          <input id="startTimeInput" type="time">
        </label>
        <label class="live-field">
          <span>Kalış</span>
          <select id="durationInput">
            <option value="30">30 dk</option>
            <option value="45">45 dk</option>
            <option value="60">1 saat</option>
            <option value="75">1 sa 15 dk</option>
            <option value="90">1 sa 30 dk</option>
            <option value="120">2 saat</option>
            <option value="150">2 sa 30 dk</option>
            <option value="180">3 saat</option>
          </select>
        </label>
      </div>
      <div class="recalc" id="recalcInfo"></div>

      <div class="detail-actionbar">
        <button class="round-nav" id="prevStopBtn" type="button" aria-label="Önceki durak">‹</button>
        <button class="main-action" id="detailDone" type="button">✓ Gidildi</button>
        <button class="main-action secondary" id="detailSkip" type="button">Atla</button>
        <button class="round-nav" id="nextStopBtn" type="button" aria-label="Sonraki durak">›</button>
      </div>

      <a class="route-link" id="detailRoute" target="_blank" rel="noopener">Google Maps'te yol tarifini aç ↗</a>
      <div class="detail-hint">Görselde sağ/sola dokun: fotoğraf · ekranı kaydır: durak</div>
    </section>
  </div>

  <aside class="floating-panel notes-panel" id="notesPanel" hidden>
    <div class="panel-head">
      <div>
        <small>BU DURAK</small>
        <h3>Notlar / checklist</h3>
      </div>
      <button class="panel-close" id="notesCloseBtn" type="button">×</button>
    </div>
    <div class="notes-list" id="notesList"></div>
    <form class="note-composer" id="noteForm">
      <input id="noteInput" type="text" placeholder="Bir not yaz, Enter ile ekle…" autocomplete="off">
      <button type="submit">↑</button>
    </form>
    <div class="panel-help">İşaretlemek için checkbox'a dokun. Silmek için notu sola kaydır.</div>
  </aside>

  <aside class="floating-panel map-panel" id="mapPanel" hidden>
    <div class="panel-head">
      <div>
        <small>SONRAKİ ADIM</small>
        <h3 id="mapPanelTitle">Rota</h3>
      </div>
      <button class="panel-close" id="mapCloseBtn" type="button">×</button>
    </div>
    <div class="map-frame">
      <iframe id="mapFrame" title="Google Maps rota görünümü" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <div class="map-summary" id="mapSummary"></div>
    <a class="panel-route-link" id="mapExternal" target="_blank" rel="noopener">Google Maps'te aç ↗</a>
  </aside>
</div>

function parseClock(v){if(!v||!/^\\d{1,2}:\\d{2}$/.test(v))return null;const [h,m]=v.split(':').map(Number);return h*60+m}
function fmtClock(n){n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function defaultDuration(it){const d=it.duration||'';if(/2[–-]3/.test(d))return 150;if(/90[–-]120/.test(d))return 105;if(/75[–-]90/.test(d))return 80;if(/60[–-]90/.test(d))return 75;if(/60[–-]75/.test(d))return 65;if(/60/.test(d))return 60;if(/45/.test(d))return 45;if(/35/.test(d))return 40;return 60}
function isFixedEvent(it){return /wicked|house of yes|campbell/i.test(it.title)||/Etkinlik|Bar/i.test(it.tag)}
function estimateTravelMinutes(txt){if(!txt)return 10;let m=txt.match(/(\\d+)[–-](\\d+)\\s*dk/);if(m)return Math.round((+m[1]+ +m[2])/2);m=txt.match(/(\\d+)\\s*dk/);if(m)return +m[1];if(/subway|metro|treni/i.test(txt))return 25;return 12}
function ensureTiming(di,ii){const d=DAYS[di],it=d.items[ii],k=d.id+'-'+ii;if(!timing[k])timing[k]={start:parseClock(it.time)!=null?it.time:null,duration:defaultDuration(it),manualStart:false};return timing[k]}
function recalcDay(di){const d=DAYS[di];for(let i=0;i<d.items.length;i++){const it=d.items[i],t=ensureTiming(di,i),planned=parseClock(it.time);if(i===0){if(!t.start&&planned!=null)t.start=fmtClock(planned);continue}const prev=ensureTiming(di,i-1);const prevStart=parseClock(prev.start);if(isFixedEvent(it)&&planned!=null&&!t.manualStart){t.start=fmtClock(planned);continue}if(!t.manualStart&&prevStart!=null)t.start=fmtClock(prevStart+prev.duration+estimateTravelMinutes(it.travel))}localStorage.setItem('nyc-timing-v9',JSON.stringify(timing))}

function durationLabel(mins){if(mins<60)return mins+' dk';const h=Math.floor(mins/60),m=mins%60;return m?`${h} sa ${m} dk`:`${h} saat`}
function saveTimingFromUI(){const t=ensureTiming(dayIndex,detailIndex);const v=startTimeInputEl.value;if(v){t.start=v;t.manualStart=true}t.duration=Number(durationInputEl.value)||60;recalcDay(dayIndex);syncDetail();render()}

function shortTimeLabel(v){
  if(!v)return '';
  if(/^\d{1,2}:\d{2}$/.test(v)) return v.padStart(5,'0');
  if(/çıkışta|akşam|gece|rezervasyon/i.test(v)) return v;
  return v;
}
function transportMeta(txt){
  const t=(txt||'').toLowerCase();
  if(t.includes('tram')) return '🚋 Tram';
  if(t.includes('ferry')||t.includes('feribot')) return '⛴ Ferry';
  if(t.includes('subway')||t.includes('metro')||t.includes('treni')) return 'Ⓜ Metro';
  if(t.includes('yürüy')) return '↗ Yürü';
  if(t.includes('havaalan')) return '✈ Transfer';
  return '↗ Rota';
}
function travelDurationLabel(txt){
  if(!txt)return '';
  const m=txt.match(/(\d+)[–-](\d+)\s*dk/i);
  if(m)return `${m[1]}–${m[2]} dk`;
  const s=txt.match(/(\d+)\s*dk/i);
  if(s)return `${s[1]} dk`;
  return '';
}

    empty.style.cssText='font-size:12px;color:#aaa;padding:10px 6px 14px';
    empty.textContent='Henüz not yok.';

  arr.forEach((n,i)=>{

    del.onclick=()=>{arr.splice(i,1);persistNotes();renderNotes()};

    row.innerHTML=`<button class="note-check">${n.checked?'✓':''}</button><div class="note-text"></div>`;
    row.querySelector('.note-text').textContent=n.text;
    row.querySelector('.note-check').onclick=(e)=>{e.stopPropagation();n.checked=!n.checked;persistNotes();renderNotes()};
    row.onclick=()=>{if(row.classList.contains('reveal')) row.classList.remove('reveal')};
    let x0=null,y0=null;
    row.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
    row.addEventListener('touchend',e=>{

      const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
      if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){
        if(dx<0) row.classList.add('reveal');
        else row.classList.remove('reveal');
      }
      x0=y0=null;
    },{passive:true});
    wrap.appendChild(del); wrap.appendChild(row); list.appendChild(wrap);
  });
}

function bindHorizontalSwipe(el,onLeft,onRight){
  let sx=null,sy=null,active=false;
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,a,input,textarea,.notes-panel')) return;
    sx=e.clientX;sy=e.clientY;active=true;

  });

function renderV10Story(){
  clearTimeout(v10StoryTimer);
  const it=v10Item(), imgs=(Array.isArray(it.images)&&it.images.length)?it.images:[it.img];
  V10.img.src=imgs[v10StoryIndex];
  V10.storybar.innerHTML='';
  imgs.forEach((_,i)=>{
    const seg=document.createElement('div');
    seg.className='storyseg '+(i<v10StoryIndex?'done':i===v10StoryIndex?'active':'');
    seg.innerHTML='<div class="storyfill"></div>';
    V10.storybar.appendChild(seg);
  });
  if(v10StoryIndex<imgs.length-1){
    v10StoryTimer=setTimeout(()=>{v10StoryIndex++;renderV10Story()},5000);
  }
}
function nextStoryV10(){
  const it=v10Item(), imgs=(Array.isArray(it.images)&&it.images.length)?it.images:[it.img];
  if(v10StoryIndex<imgs.length-1){v10StoryIndex++;renderV10Story()}
}
function prevStoryV10(){if(v10StoryIndex>0){v10StoryIndex--;renderV10Story()}}

function toggleNotesV10(){
  V10.mapPanel.hidden=true;
  V10.notesPanel.hidden=!V10.notesPanel.hidden;
  if(!V10.notesPanel.hidden){renderNotesV10();setTimeout(()=>V10.noteInput.focus(),50)}
}
function noteArrayV10(){
  const k=v10Key();
  if(!Array.isArray(notes[k])) notes[k]=[];
  return notes[k];
}
function persistNotesV10(){localStorage.setItem('nyc-notes-v8',JSON.stringify(notes))}
function renderNotesV10(){
  const arr=noteArrayV10(); V10.notesList.innerHTML='';
  if(!arr.length){
    const e=document.createElement('div');e.style.cssText='padding:10px 6px 14px;color:#999;font-size:12px';e.textContent='Henüz not yok.';V10.notesList.appendChild(e);return;
  }
  arr.forEach((n,i)=>{
    const wrap=document.createElement('div');wrap.className='note-row-wrap';
    const del=document.createElement('button');del.type='button';del.className='note-delete';del.textContent='Sil';
    del.addEventListener('click',()=>{arr.splice(i,1);persistNotesV10();renderNotesV10()});
    const row=document.createElement('div');row.className='note-row'+(n.checked?' checked':'');
    const check=document.createElement('button');check.type='button';check.className='note-check';check.textContent=n.checked?'✓':'';
    const text=document.createElement('div');text.className='note-text';text.textContent=n.text;
    check.addEventListener('click',()=>{n.checked=!n.checked;persistNotesV10();renderNotesV10()});
    let sx=null,sy=null;
    row.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
    row.addEventListener('pointerup',e=>{
      if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){if(dx<0)row.classList.add('reveal');else row.classList.remove('reveal')}
      sx=sy=null;
    });
    row.append(check,text);wrap.append(del,row);V10.notesList.appendChild(wrap);
  });
}
function addNoteV10(){
  const text=V10.noteInput.value.trim();if(!text)return;
  noteArrayV10().push({text,checked:false});V10.noteInput.value='';persistNotesV10();renderNotesV10();
}
function toggleMapV10(){
  V10.notesPanel.hidden=true;
  V10.mapPanel.hidden=!V10.mapPanel.hidden;
  if(V10.mapPanel.hidden)return;
  const it=v10Item(), d=DAYS[dayIndex], next=d.items[detailIndex+1];
  const q=encodeURIComponent(next?next.title+' New York':it.title+' New York');
  V10.mapFrame.src='https://www.google.com/maps?q='+q+'&output=embed';
  V10.mapSummary.innerHTML=next
    ? `<b>${it.title}</b> → <b>${next.title}</b><br>${next.travel||'Sonraki durağa geçiş'}`
    : 'Bu, günün son durağı.';
  V10.mapExternal.href=next?next.maps:it.maps;
}

document.getElementById('closeDetailBtn').addEventListener('click',closeDetail);
document.getElementById('noteToggle').addEventListener('click',toggleNotesV10);
document.getElementById('mapToggle').addEventListener('click',toggleMapV10);
document.getElementById('notesCloseBtn').addEventListener('click',()=>V10.notesPanel.hidden=true);
document.getElementById('mapCloseBtn').addEventListener('click',()=>V10.mapPanel.hidden=true);
document.getElementById('prevStopBtn').addEventListener('click',prevDetail);
document.getElementById('nextStopBtn').addEventListener('click',nextDetail);
document.getElementById('detailDone').addEventListener('click',()=>mark('done'));
document.getElementById('detailSkip').addEventListener('click',()=>mark('skip'));
document.querySelector('.storytap-left').addEventListener('click',e=>{e.stopPropagation();prevStoryV10()});
document.querySelector('.storytap-right').addEventListener('click',e=>{e.stopPropagation();nextStoryV10()});
V10.start.addEventListener('change',saveTimingV10);
V10.duration.addEventListener('change',saveTimingV10);
V10.noteForm.addEventListener('submit',e=>{e.preventDefault();addNoteV10()});

V10.detail.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,a,input,select,.floating-panel'))return;
  v10SwipeX=e.clientX;v10SwipeY=e.clientY;
});
V10.detail.addEventListener('pointerup',e=>{
  if(v10SwipeX===null)return;
  const dx=e.clientX-v10SwipeX,dy=e.clientY-v10SwipeY;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){dx<0?nextDetail():prevDetail()}
  v10SwipeX=v10SwipeY=null;
});

</script>
