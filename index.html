  const fallback = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query+' near me');

  if(!navigator.geolocation){
    window.open(fallback,'_blank','noopener');
    return;
  }

  els.emergencyStatus.textContent='Konum alınıyor…';

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude, lng=pos.coords.longitude;
      const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query)+'&query_place_id=&center='+lat+','+lng;
      els.emergencyStatus.textContent='Google Maps açılıyor…';
      window.open(url,'_blank','noopener');
    },
    ()=>{
      els.emergencyStatus.textContent='Konum izni alınamadı. Google Maps yakın araması açılıyor.';
      window.open(fallback,'_blank','noopener');
    },
    {enableHighAccuracy:true,timeout:7000,maximumAge:60000}
  );
}


$('emergencyBtn').onclick=openEmergency;
$('emergencyClose').onclick=closeEmergency;
$('nearestPharmacy').onclick=()=>openNearest('pharmacy');
$('nearestHospital').onclick=()=>openNearest('hospital');
els.emergencySheet.addEventListener('click',e=>{if(e.target===els.emergencySheet)closeEmergency()});

let sx=null,sy=null;els.detail.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select,a,.panel'))return;sx=e.clientX;sy=e.clientY});els.detail.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))dx<0?nextStop():prevStop();sx=sy=null});



function syncNotesKeyboard(){
  if(!window.visualViewport || els.notesBottomLayer.hidden)return;
  const vv=window.visualViewport;
  const keyboard=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  els.notesBottomLayer.style.bottom=(keyboard+12)+'px';
}
function resetNotesKeyboard(){
  els.notesBottomLayer.style.bottom='';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncNotesKeyboard);
  window.visualViewport.addEventListener('scroll',syncNotesKeyboard);
}

render();
</script></body></html>
